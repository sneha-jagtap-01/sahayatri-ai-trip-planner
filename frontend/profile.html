<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | Sahayatri</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            🌿 Sahayatri
        </div>

        <div class="nav-links">

            <a href="index.html">Home</a>
            <a href="explore.html">Explore</a>
            <a href="my-trips.html">My Trips</a>

        </div>

    </nav>


    <!-- PROFILE -->

    <main class="profile-page">

        <div class="profile-card">

            <div class="profile-photo-wrapper">

    <img id="profile-photo"
         class="profile-photo"
         src=""
         alt="Profile Photo">

    <div id="default-avatar" class="profile-avatar-large">
        👤
    </div>

</div>

<label for="photo-upload" class="change-photo-btn">
    📷 Change Photo
</label>

<input type="file"
       id="photo-upload"
       accept="image/*"
       hidden>

            <h1 id="profile-name">
                User
            </h1>

            <p id="profile-email">
                user@gmail.com
            </p>

            <div class="profile-divider"></div>


            <div class="profile-info">

                <div class="profile-info-item">
                    <span>🌿</span>
                    <div>
                        <small>Member</small>
                        <strong>Sahayatri Traveller</strong>
                    </div>
                </div>


                <div class="profile-info-item">
                    <span>❤️</span>
                    <div>
                        <small>Saved Trips</small>
                        <strong id="trip-count">0 Trips</strong>
                    </div>
                </div>

            </div>


            <div class="profile-actions">

                <a href="my-trips.html" class="profile-main-btn">
                    🗺️ My Trips
                </a>

                <button id="logout-profile" class="profile-logout-btn">
                    🚪 Logout
                </button>

            </div>

        </div>

    </main>


    <script>

        const email = localStorage.getItem("loggedInUser");
        const name = localStorage.getItem("userName");


        // Check login

        if (!email) {

            alert("Please login first 🔐");

            window.location.href = "login.html";

        }


        // Show user details

        document.getElementById("profile-name").innerText =
            name || "Sahayatri User";

        document.getElementById("profile-email").innerText =
            email || "";


        // Load saved trips count

        if (email) {

            fetch(
                "http://localhost:8080/api/trips/user/" +
                encodeURIComponent(email)
            )
            .then(response => response.json())
            .then(trips => {

                document.getElementById("trip-count").innerText =
                    trips.length + (trips.length === 1 ? " Trip" : " Trips");

            })
            .catch(error => {

                console.error("Unable to load trips:", error);

            });

        }


        // Logout

        document.getElementById("logout-profile")
            .addEventListener("click", function () {

                localStorage.removeItem("loggedInUser");
                localStorage.removeItem("userName");

                alert("Logged out successfully 👋");

                window.location.href = "index.html";

            });


            // ==========================================
// PROFILE PHOTO
// ==========================================

const profilePhoto = document.getElementById("profile-photo");
const defaultAvatar = document.getElementById("default-avatar");
const photoUpload = document.getElementById("photo-upload");


// Load saved profile photo

const savedPhoto = localStorage.getItem("profilePhoto");

if (savedPhoto) {

    profilePhoto.src = savedPhoto;
    profilePhoto.style.display = "block";
    defaultAvatar.style.display = "none";

}


// Upload new photo

photoUpload.addEventListener("change", function(event) {

    const file = event.target.files[0];

    if (!file) {
        return;
    }

    // Check image type

    if (!file.type.startsWith("image/")) {

        alert("Please select an image file 📷");
        return;

    }

    const reader = new FileReader();

    reader.onload = function(e) {

        const imageData = e.target.result;

        // Save photo

        localStorage.setItem("profilePhoto", imageData);

        // Show photo

        profilePhoto.src = imageData;
        profilePhoto.style.display = "block";
        defaultAvatar.style.display = "none";

    };

    reader.readAsDataURL(file);

});

    </script>

</body>

</html>
